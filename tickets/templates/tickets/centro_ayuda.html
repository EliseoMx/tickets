<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Centro de ayuda - {{ nombre_sistema }}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f5f7;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #2c3e50;
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
            font-size: 20px;
        }

        .boton-secundario {
            background-color: transparent;
            border: 1px solid white;
            color: white;
            padding: 8px 16px;
            border-radius: 5px;
            text-decoration: none;
            font-size: 14px;
            cursor: pointer;
        }

        .boton-link {
            background: transparent;
            cursor: pointer;
            font-size: 14px;
        }

        .boton-notificacion {
            position: relative;
            margin-right: 15px;
        }

        .badge {
            background-color: #e74c3c;
            color: white;
            border-radius: 50%;
            padding: 2px 7px;
            font-size: 11px;
            font-weight: bold;
            margin-left: 5px;
        }

        .badge-cliente {
            background-color: #27ae60;
            color: white;
            border-radius: 10px;
            padding: 2px 8px;
            font-size: 11px;
            font-weight: bold;
            margin-left: 5px;
        }

        .reloj {
            font-size: 12px;
            margin-top: 4px;
            opacity: 0.85;
            font-variant-numeric: tabular-nums;
        }

        .version-sistema {
            font-size: 11px;
            opacity: 0.6;
            margin-top: 2px;
        }

        .contenedor {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .encabezado-centro {
            background: white;
            padding: 30px 35px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 25px;
        }

        .encabezado-centro h2 {
            color: #2c3e50;
            margin-top: 0;
        }

        .buscador-ayuda {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 16px;
            font-size: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            margin-top: 12px;
        }

        .buscador-ayuda:focus {
            outline: 2px solid #2980b9;
            border-color: #2980b9;
        }

        /* --- Tarjetas de sección (como las tarjetas de empresa) --- */
        .grid-secciones {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        @media (max-width: 720px) {
            .grid-secciones {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 480px) {
            .grid-secciones {
                grid-template-columns: 1fr;
            }
        }

        .tarjeta-seccion {
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
            padding: 28px 20px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
            border: 2px solid transparent;
        }

        .tarjeta-seccion:hover {
            transform: translateY(-4px);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.15);
        }

        .tarjeta-seccion.activa {
            border-color: #2980b9;
        }

        .icono-seccion {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            margin: 0 auto 12px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
        }

        .tarjeta-seccion h3 {
            margin: 0 0 4px 0;
            font-size: 15px;
            color: #2c3e50;
        }

        .tarjeta-seccion p {
            margin: 0;
            font-size: 12px;
            color: #888;
        }

        /* --- Panel dividido: mitad tarjetas / mitad explicación --- */
        .panel-split {
            display: none;
            gap: 20px;
            align-items: flex-start;
        }

        .barra-split {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .barra-split h3 {
            margin: 0;
            color: #2c3e50;
        }

        .cerrar-split {
            display: inline-block;
            background-color: #7f8c8d;
            color: white;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            text-decoration: none;
            white-space: nowrap;
            padding: 10px 20px;
            border-radius: 6px;
            transition: background-color 0.15s;
        }

        .cerrar-split:hover {
            background-color: #6b7778;
        }

        .mitad-tarjetas {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 65vh;
            overflow-y: auto;
            padding-right: 6px;
        }

        .tarjeta-tutorial-mini {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
            padding: 14px 16px;
            display: flex;
            gap: 12px;
            align-items: flex-start;
            cursor: pointer;
            border: 2px solid transparent;
        }

        .tarjeta-tutorial-mini:hover {
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.12);
        }

        .tarjeta-tutorial-mini.activa {
            border-color: #2980b9;
            background: #eaf2f8;
        }

        .icono-mini {
            font-size: 18px;
        }

        .tarjeta-tutorial-mini h4 {
            margin: 0 0 3px 0;
            font-size: 14px;
            color: #2c3e50;
        }

        .tarjeta-tutorial-mini p {
            margin: 0;
            font-size: 12px;
            color: #888;
        }

        .mitad-explicacion {
            flex: 1;
            min-width: 0;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
            padding: 26px 28px;
            max-height: 65vh;
            overflow-y: auto;
            position: sticky;
            top: 20px;
        }

        .encabezado-explicacion {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 14px;
        }

        .encabezado-explicacion .icono-explicacion {
            font-size: 26px;
        }

        .encabezado-explicacion h3 {
            margin: 0;
            color: #2c3e50;
        }

        .mitad-explicacion ol {
            margin: 0;
            padding-left: 20px;
        }

        .mitad-explicacion li {
            margin-bottom: 10px;
            line-height: 1.5;
        }

        .mitad-explicacion .nota {
            background: #eaf2f8;
            border-radius: 6px;
            padding: 10px 14px;
            font-size: 13px;
            color: #2c3e50;
            margin-top: 14px;
        }

        .placeholder-explicacion {
            color: #999;
            font-style: italic;
        }

        .sin-resultados-split {
            color: #999;
            font-style: italic;
            text-align: center;
            padding: 20px;
        }

        @media (max-width: 720px) {
            .panel-split {
                flex-direction: column;
            }

            .mitades-split {
                flex-direction: column;
            }

            .mitad-explicacion {
                position: static;
                max-height: none;
            }

            .mitad-tarjetas {
                max-height: none;
                overflow-y: visible;
            }
        }

        .volver {
            display: inline-block;
            margin: 25px 0 30px 0;
            color: #2980b9;
            text-decoration: none;
        }

        @media (max-width: 600px) {
            header {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }

            .contenedor {
                margin: 15px 0;
                padding: 0 10px;
            }

            .encabezado-centro {
                padding: 20px;
            }

            .mitad-explicacion {
                padding: 18px;
            }
        }
    </style>
</head>

<body>
    <header>
        <div>
            <h1><a href="{% url 'inicio' %}" style="color:inherit; text-decoration:none;">{{ nombre_sistema }}</a></h1>
            <div class="reloj" id="reloj"></div>
            <div class="version-sistema">{{ version_sistema }}</div>
        </div>
        {% include 'tickets/_barra_usuario.html' %}
    </header>

    <div class="contenedor">
        <div class="encabezado-centro">
            <h2>📚 Centro de ayuda</h2>
            <p>Elige un tema, o busca por palabra clave, título o tema.</p>
            <input type="text" id="buscador-ayuda" class="buscador-ayuda" placeholder="Ej. crear usuario, logo de empresa, exportar, contraseña...">
        </div>

        <div class="grid-secciones" id="grid-secciones"></div>

        <div class="panel-split" id="panel-split">
            <div style="flex-basis:100%;">
                <div class="barra-split">
                    <h3 id="titulo-split"></h3>
                    <a class="cerrar-split" id="cerrar-split">✕ Cerrar</a>
                </div>
                <div class="mitades-split" style="display:flex; gap:20px; align-items:flex-start;">
                    <div class="mitad-tarjetas" id="mitad-tarjetas"></div>
                    <div class="mitad-explicacion" id="mitad-explicacion"></div>
                </div>
            </div>
        </div>

        <a href="{% url 'inicio' %}" class="volver">← Volver a inicio</a>
    </div>

    <script>
        (function () {
            var zonaHoraria = Intl.DateTimeFormat().resolvedOptions().timeZone;
            var coincidencia = document.cookie.match(/(?:^|; )django_timezone=([^;]*)/);
            var zonaGuardada = coincidencia ? decodeURIComponent(coincidencia[1]) : null;

            if (zonaHoraria && zonaHoraria !== zonaGuardada) {
                document.cookie = 'django_timezone=' + encodeURIComponent(zonaHoraria) + ';path=/;max-age=31536000';
                location.reload();
                return;
            }

            function actualizarReloj() {
                var el = document.getElementById('reloj');
                if (!el) return;
                var ahora = new Date();
                var horas = String(ahora.getHours()).padStart(2, '0');
                var minutos = String(ahora.getMinutes()).padStart(2, '0');
                var segundos = String(ahora.getSeconds()).padStart(2, '0');
                el.textContent = horas + ':' + minutos + ':' + segundos + ' (' + zonaHoraria + ')';
            }
            actualizarReloj();
            setInterval(actualizarReloj, 1000);
        })();
    </script>

                    palabras: 'filtros buscar exportar csv excel tabla columna',
                    pasos: [
                        'Cada tabla del sistema (tickets, usuarios, empresas) tiene una fila de <strong>filtros por columna</strong> — puedes seleccionar varios valores a la vez en cada uno.',
                        'Además hay un <strong>buscador general</strong> que filtra por cualquier texto visible en la tabla.',
                        'Los botones <strong>"Exportar CSV"</strong> / <strong>"Exportar Excel"</strong> descargan exactamente lo que esté filtrado/visible en ese momento.'
                    ]
                },
                {
                    id: 'roles', tema: 'roles', icono: '👥',
                    titulo: 'Roles y permisos: qué puede hacer cada quién',
                    resumen: 'Administrador, Agente de Soporte, Agente Cliente y Cliente.',
                    palabras: 'roles permisos que puede hacer cada quien administrador agente cliente soporte',
                    pasos: [
                        '<strong>Administrador:</strong> ve y edita todo, sin restricciones, en todas las empresas. Puede crear otros administradores y eliminar usuarios de forma permanente.',
                        '<strong>Agente de Soporte:</strong> ve y atiende todos los tickets de las empresas que tiene asignadas.',
                        '<strong>Agente Cliente:</strong> levanta tickets, crea usuarios clientes de su empresa, los activa/desactiva y les restablece la contraseña, y ve (solo lectura) los tickets de su empresa.',
                        '<strong>Cliente:</strong> levanta tickets y ve/comenta únicamente los suyos.'
                    ]
                },
                {
                    id: 'notificaciones', tema: 'general', icono: '🔔',
                    titulo: 'Notificaciones (avisos de tickets nuevos o con respuesta)',
                    resumen: 'El numerito rojo junto a "Atender tickets" o "Mis tickets".',
                    palabras: 'notificaciones avisos tickets nuevos comentarios pendientes badge',
                    pasos: [
                        'Si eres soporte, el número junto a <strong>Atender tickets</strong> indica cuántos tickets tienen comentarios nuevos del cliente que todavía no has visto.',
                        'Si eres cliente, el número junto a <strong>Mis tickets</strong> indica cuántos de tus tickets tienen una actualización nueva de soporte.',
                        'El número se actualiza solo, sin tener que recargar la página.'
                    ]
                }
            ];

            var gridSecciones = document.getElementById('grid-secciones');
            var panelSplit = document.getElementById('panel-split');
            var mitadTarjetas = document.getElementById('mitad-tarjetas');
            var mitadExplicacion = document.getElementById('mitad-explicacion');
            var tituloSplit = document.getElementById('titulo-split');
            var buscador = document.getElementById('buscador-ayuda');
            var seccionActiva = null;

            function renderSecciones() {
                gridSecciones.innerHTML = '';
                SECCIONES.forEach(function (sec) {
                    var count = TUTORIALES.filter(function (t) { return t.tema === sec.tema; }).length;
                    var div = document.createElement('div');
                    div.className = 'tarjeta-seccion';
                    div.dataset.tema = sec.tema;
                    div.innerHTML =
                        '<div class="icono-seccion" style="background-color:' + sec.color + '22; color:' + sec.color + ';">' + sec.icono + '</div>' +
                        '<h3>' + sec.nombre + '</h3>' +
                        '<p>' + count + ' tutorial' + (count === 1 ? '' : 'es') + '</p>';
                    div.addEventListener('click', function () { toggleSeccion(sec.tema, sec.nombre); });
                    gridSecciones.appendChild(div);
                });
            }

            function marcarSeccionActiva(tema) {
                Array.from(gridSecciones.children).forEach(function (card) {
                    card.classList.toggle('activa', card.dataset.tema === tema);
                });
            }

            function renderMitadTarjetas(lista) {
                mitadTarjetas.innerHTML = '';
                if (lista.length === 0) {
                    mitadTarjetas.innerHTML = '<p class="sin-resultados-split">No se encontró ningún tutorial con esa búsqueda.</p>';
                    mostrarExplicacion(null);
                    return;
                }
                lista.forEach(function (t, i) {
                    var div = document.createElement('div');
                    div.className = 'tarjeta-tutorial-mini' + (i === 0 ? ' activa' : '');
                    div.dataset.id = t.id;
                    div.innerHTML =
                        '<span class="icono-mini">' + t.icono + '</span>' +
                        '<div><h4>' + t.titulo + '</h4><p>' + t.resumen + '</p></div>';
                    div.addEventListener('click', function () {
                        mostrarExplicacion(t);
                        Array.from(mitadTarjetas.children).forEach(function (c) { c.classList.remove('activa'); });
                        div.classList.add('activa');
                    });
                    mitadTarjetas.appendChild(div);
                });
                mostrarExplicacion(lista[0]);
            }

            function mostrarExplicacion(t) {
                if (!t) {
                    mitadExplicacion.innerHTML = '<p class="placeholder-explicacion">Selecciona un tutorial de la lista para ver los pasos.</p>';
                    return;
                }
                var pasosHtml = t.pasos.map(function (p) { return '<li>' + p + '</li>'; }).join('');
                var notaHtml = t.nota ? '<div class="nota">💡 ' + t.nota + '</div>' : '';
                mitadExplicacion.innerHTML =
                    '<div class="encabezado-explicacion"><span class="icono-explicacion">' + t.icono + '</span><h3>' + t.titulo + '</h3></div>' +
                    '<ol>' + pasosHtml + '</ol>' + notaHtml;
            }

            function abrirSplit(nombreTitulo, lista) {
                tituloSplit.textContent = nombreTitulo;
                renderMitadTarjetas(lista);
                panelSplit.style.display = 'flex';
                gridSecciones.style.display = 'none';
            }

            function cerrarSplit() {
                seccionActiva = null;
                buscador.value = '';
                panelSplit.style.display = 'none';
                gridSecciones.style.display = 'grid';
                marcarSeccionActiva(null);
            }

            function toggleSeccion(tema, nombre) {
                if (seccionActiva === tema) {
                    cerrarSplit();
                    return;
                }
                seccionActiva = tema;
                marcarSeccionActiva(tema);
                var lista = TUTORIALES.filter(function (t) { return t.tema === tema; });
                abrirSplit(nombre, lista);
            }

            buscador.addEventListener('input', function () {
                var texto = buscador.value.trim().toLowerCase();
                if (!texto) {
                    seccionActiva = null;
                    panelSplit.style.display = 'none';
                    gridSecciones.style.display = 'grid';
                    marcarSeccionActiva(null);
                    return;
                }
                seccionActiva = null;
                marcarSeccionActiva(null);
                var coincidencias = TUTORIALES.filter(function (t) {
                    var contenido = (t.titulo + ' ' + t.resumen + ' ' + t.palabras + ' ' + t.pasos.join(' ')).toLowerCase();
                    return contenido.indexOf(texto) !== -1;
                });
                abrirSplit('Resultados de búsqueda: "' + buscador.value.trim() + '" (' + coincidencias.length + ')', coincidencias);
            });

            document.getElementById('cerrar-split').addEventListener('click', cerrarSplit);

            renderSecciones();
        })();
    </script>
